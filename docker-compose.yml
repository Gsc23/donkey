services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seeder
      POSTGRES_PASSWORD: seeder
      POSTGRES_DB: seeder_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeder"]
      interval: 2s
      timeout: 3s
      retries: 10
